<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ホップ アロマ比較 / 製品ホップ成分表</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f7f6f2;color:#2c2c2a;display:flex;flex-direction:column;}
.tab-nav{display:flex;background:#2c2c2a;flex-shrink:0;z-index:200;}
.tab-nav button{flex:1;padding:13px 4px;font-size:13px;font-weight:600;border:none;background:transparent;color:#888;cursor:pointer;border-bottom:3px solid transparent;}
.tab-nav button.active{color:#fff;border-bottom-color:#639922;}
.panels{flex:1;overflow:hidden;position:relative;}
.tab-panel{position:absolute;inset:0;overflow-y:auto;display:none;padding:12px;}
.tab-panel.active{display:block;}
@media(min-width:700px){.tab-panel{max-width:720px;left:50%;transform:translateX(-50%);right:auto;width:720px;}}
h2{font-size:16px;font-weight:700;margin-bottom:8px;}
.note{font-size:11px;color:#888780;margin-top:12px;line-height:1.6;padding-bottom:20px;}

/* TAB1 RADAR */
.progress{font-size:12px;color:#5f5e5a;margin-bottom:6px;}
.pbar{height:5px;background:#e0ddd4;border-radius:3px;overflow:hidden;margin-top:3px;}
.pbar-fill{height:100%;background:#639922;}
.srch-row{display:flex;gap:6px;margin-bottom:6px;}
.srch-row input{flex:1;padding:8px 10px;font-size:14px;border:1px solid #ccc;border-radius:8px;}
.srch-row button{padding:8px 12px;font-size:13px;border:1px solid #ccc;border-radius:8px;background:#fff;cursor:pointer;white-space:nowrap;}
#alpha-tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;}
.alpha-tab{padding:5px 8px;font-size:12px;font-weight:600;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;color:#555;min-width:28px;text-align:center;}
.alpha-tab.active{background:#2c2c2a;color:#fff;border-color:#2c2c2a;}
#hop-buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;max-height:180px;overflow-y:auto;padding:5px;border:1px solid #e0ddd4;border-radius:8px;background:#fff;margin-bottom:10px;}
@media(min-width:420px){#hop-buttons{grid-template-columns:repeat(3,1fr);}}
@media(min-width:700px){#hop-buttons{grid-template-columns:repeat(4,1fr);}}
#hop-buttons button{font-size:11px;line-height:1.3;padding:7px 4px;border:1px solid #ccc;border-radius:7px;background:#fff;cursor:pointer;text-align:center;min-height:36px;display:flex;align-items:center;justify-content:center;word-break:break-word;}
#hop-buttons button.active{font-weight:700;}
.chart-wrap{position:relative;width:100%;height:290px;background:#fff;border-radius:8px;padding:6px;}
@media(min-width:700px){.chart-wrap{height:380px;}}
#legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:11px;color:#5f5e5a;}
#legend span{display:flex;align-items:center;gap:3px;}
.sw{width:9px;height:9px;border-radius:2px;display:inline-block;flex-shrink:0;}
.hop-desc-box{background:#f7f6f2;border:1px solid #e0ddd4;border-radius:8px;padding:8px;margin-top:8px;display:none;display:flex;flex-direction:column;gap:6px;}
.hop-desc-item{background:#fff;border-radius:6px;padding:8px 10px;border-left:3px solid #639922;}
.hop-desc-name{font-size:12px;font-weight:700;color:#2c2c2a;margin-bottom:2px;}
.hop-desc-text{font-size:11px;color:#5f5e5a;line-height:1.6;}
.back-to-products-btn{width:100%;padding:9px;font-size:13px;font-weight:600;background:#f0f0ee;color:#2c2c2a;border:1px solid #ddd;border-radius:8px;cursor:pointer;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:4px;}
.back-to-products-btn:active{background:#e5e3de;}

/* TAB2 PRODUCTS */
.t2-header{display:flex;gap:6px;margin-bottom:6px;align-items:center;}
.t2-header input[type=search]{flex:1;padding:8px 10px;font-size:14px;border:1px solid #ccc;border-radius:8px;}
.t2-header select{padding:8px 6px;font-size:13px;border:1px solid #ccc;border-radius:8px;background:#fff;max-width:110px;}
#prod-count{font-size:11px;color:#888;margin-bottom:6px;}
.updated-line{font-size:11px;color:#aaa;margin-bottom:6px;}
#prod-list{display:flex;flex-direction:column;gap:0;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07);}

/* 商品行 */
.prod-row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid #f0ede6;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.prod-row-img{width:52px;height:52px;border-radius:8px;object-fit:cover;flex-shrink:0;background:#f5f3ee;}
.prod-row-img-placeholder{width:52px;height:52px;border-radius:8px;background:#f0ede6;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;}
.m-img{width:100%;max-width:200px;height:200px;object-fit:cover;border-radius:12px;margin:0 auto 16px;display:block;}
.m-img-wrap{text-align:center;}
.prod-row:last-child{border-bottom:none;}
.prod-row:active{background:#f0ede6;}

/* 左: 商品名・メーカー・バッジ */
.prod-row-left{flex:1;min-width:0;}
.prod-row-name{font-size:13px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prod-row-brewery{font-size:11px;color:#639922;font-weight:500;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prod-row-sub{font-size:10px;color:#aaa;margin-top:3px;display:flex;gap:5px;align-items:center;}
.sbadge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:6px;background:#e3eef8;color:#1a4a7a;white-space:nowrap;}
.new-badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:6px;background:#E24B4A;color:#fff;white-space:nowrap;}
.abv-text{color:#bbb;}

/* 右: ホップ名 + 矢印 */
.prod-row-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;max-width:38%;min-width:80px;}
.prod-hop-list{font-size:10px;color:#639922;font-weight:500;text-align:right;line-height:1.5;word-break:break-word;}
.prod-hop-none{font-size:11px;color:#ddd;text-align:right;}
.prod-row-arrow{color:#ddd;font-size:16px;line-height:1;align-self:center;}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.5);align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal-box{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:88vh;overflow-y:auto;padding:16px 16px 40px;animation:su .2s ease;}
@keyframes su{from{transform:translateY(50px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-handle{width:36px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 14px;}
.m-title{font-size:16px;font-weight:700;line-height:1.3;margin-bottom:3px;}
.m-brewery{font-size:13px;color:#639922;font-weight:600;margin-bottom:14px;}
.m-sec{margin-bottom:14px;}
.m-lbl{font-size:10px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;}
.m-val{font-size:14px;}
.m-hops{display:flex;flex-wrap:wrap;gap:6px;}
.m-hop{font-size:13px;padding:5px 12px;border-radius:20px;background:#e8f3d6;color:#3a6010;border:1px solid #c5dc9a;cursor:pointer;}
.m-hop:active{background:#d1eaa8;}
.m-nohop{font-size:13px;color:#bbb;}
.m-desc{font-size:13px;color:#4a4a48;line-height:1.65;}
.m-actions{display:flex;gap:8px;margin-top:18px;flex-direction:column;}
.m-btn-chart{padding:13px;font-size:14px;font-weight:700;background:#639922;color:#fff;border:none;border-radius:10px;cursor:pointer;}
.m-btn-chart:active{background:#4e7a1a;}
.m-btn-link{padding:13px;font-size:14px;font-weight:600;background:#f0f0ee;color:#2c2c2a;border:none;border-radius:10px;cursor:pointer;text-decoration:none;display:block;text-align:center;}
.m-btn-close{padding:13px;font-size:14px;background:#fff;color:#555;border:1px solid #ddd;border-radius:10px;cursor:pointer;margin-top:4px;width:100%;display:flex;align-items:center;justify-content:center;gap:6px;}
.shop-badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:6px;background:#f3e8ff;color:#6b21a8;white-space:nowrap;margin-left:4px;}
</style>
</head>
<body>

<div class="tab-nav">
  <button class="active" onclick="switchTab('t1',this)">&#x1F37A; ホップ アロマ比較</button>
  <button onclick="switchTab('t2',this)">&#x1F4CB; 製品ホップ成分表</button>
</div>

<div class="panels">

<div id="t1" class="tab-panel active">
  <h2>ホップ アロマ特性 比較チャート（全133品種）</h2>

</div>

<div id="t2" class="tab-panel">
  <h2>製品別ホップ成分表 — Antenna America</h2>
  <div class="updated-line">最終更新: 2026-08-17</div>
  <div class="t2-header">
    <input type="search" id="psrch" placeholder="製品名・ブリュワリーで検索...">
    <select id="sfil">
      <option value="">全スタイル</option>
      <option value="IPA">IPA / Hazy</option>
      <option value="DIPA">DIPA</option>
      <option value="Pale Ale">Pale Ale</option>
      <option value="Sour">Sour / Saison</option>
      <option value="Stout">Stout / Porter</option>
      <option value="Lager">Lager</option>
      <option value="Other">その他</option>
    </select>
    <select id="shopfil">
      <option value="">全ショップ</option>
      <option value="antenna">Antenna America</option>
      <option value="southbound">Southbound</option>
    </select>
    <select id="bfil">
      <option value="">全ブルワリー</option>
    </select>
  </div>
  <div id="prod-count"></div>
  <div id="prod-list"></div>
  <p class="note">※ 商品をタップすると成分表が表示されます。一度登録した商品はサイトから消えても削除しません。直近7日以内の新商品にはNEWバッジが付きます。</p>
</div>

</div>

<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal-box" id="mbox">
    <div class="modal-handle"></div>
    <div class="m-img-wrap" id="m-img-wrap"></div>
    <div class="m-title" id="m-title"></div>
    <div class="m-brewery" id="m-brewery"></div>
    <div class="m-sec"><div class="m-lbl">スタイル</div><div class="m-val" id="m-style"></div></div>
    <div class="m-sec"><div class="m-lbl">アルコール度数</div><div class="m-val" id="m-abv"></div></div>
    <div class="m-sec" id="m-desc-sec"><div class="m-lbl">商品説明</div><div class="m-desc" id="m-desc"></div></div>
    <div class="m-sec"><div class="m-lbl">使用ホップ</div><div id="m-hops"></div></div>
    <div class="m-actions" id="m-actions"></div>
    <button class="m-btn-close" onclick="document.getElementById('modal').classList.remove('open')">&#8592; 商品一覧に戻る</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
function switchTab(id,btn){
  document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('.tab-nav button').forEach(function(b){b.classList.remove('active');});
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
  if(id==='t1' && typeof chart !== 'undefined') chart.resize();
}
</script>

  all.title = '選択中の品種';
  all.addEventListener('click', function(){ currentLetter='\u2605'; renderAlphaTabs(); renderBtns(''); });
  nav.appendChild(all);
  letters.forEach(function(l){
    var b = document.createElement('button');
    b.textContent = l;
    b.className = 'alpha-tab' + (currentLetter === l ? ' active' : '');
    b.addEventListener('click', function(){ currentLetter=l; renderAlphaTabs(); renderBtns(''); });
    nav.appendChild(b);
  });
}

function renderBtns(filter){
  var btnCont = document.getElementById('hop-buttons');
  btnCont.innerHTML = '';
  var visible = hops.filter(function(h){
    if(filter) return h.name.toLowerCase().indexOf(filter.toLowerCase()) >= 0;
    if(currentLetter === '\u2605') return sel.indexOf(h.name) >= 0;
    return h.name[0].toUpperCase() === currentLetter;
  });
  visible.forEach(function(h){
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = h.name;
    b.dataset.name = h.name;
    b.addEventListener('click', function(){
      if(sel.indexOf(h.name) >= 0){
        sel = sel.filter(function(n){ return n !== h.name; });
      } else {
        sel.push(h.name);
      }
      refreshBtns();
      updateChart();
      showHopDesc();
    });
    btnCont.appendChild(b);
  });
  refreshBtns();
}

function showHopDesc(){
  var box = document.getElementById('hop-desc-box');
  if(!box) return;
  if(sel.length === 0){
    box.innerHTML = '';
    box.style.display = 'none';
    return;
  }
  // 選択中の全ホップの説明を表示
  var html = '';
  sel.forEach(function(name){
    var h = hops.find(function(x){ return x.name === name; });
    var desc = hopDesc[name] || '';
    if(!desc) return;
    html += '<div class="hop-desc-item" style="border-left:3px solid '+h.color+'">'
          + '<div class="hop-desc-name">'+name+'</div>'
          + '<div class="hop-desc-text">'+desc+'</div>'
          + '</div>';
  });
  if(html){
    box.innerHTML = html;
    box.style.display = 'block';
  } else {
    box.style.display = 'none';
  }
}

function refreshBtns(){
  document.querySelectorAll('#hop-buttons button').forEach(function(b){
    var on = sel.indexOf(b.dataset.name) >= 0;
    var h = hops.find(function(x){ return x.name === b.dataset.name; });
    b.classList.toggle('active', on);
    b.style.background = on ? h.color+'22' : '#fff';
    b.style.borderColor = on ? h.color : '#ccc';
  });
}

function buildDS(){
  return sel.map(function(name){
    var h = hops.find(function(x){ return x.name === name; });
    return{
      label: h.name,
      data: h.v.map(function(x){ return x/5*100; }),
      rawData: h.v,
      borderColor: h.color,
      backgroundColor: h.color+'33',
      borderWidth: 2,
      pointBackgroundColor: h.color,
      pointRadius: 3
    };
  });
}

var ctx = document.getElementById('hopChart');
var chart = new Chart(ctx, {
  type: 'radar',
  data: { labels: rlabels, datasets: buildDS() },
  options: {
    responsive: true, maintainAspectRatio: false,
    scales: { r: { min:0, max:100, ticks:{display:false}, pointLabels:{font:{size:11}} } },
    plugins: {
      legend: { display: false },
      tooltip: { callbacks: { label: function(c){ return c.dataset.label+': '+c.dataset.rawData[c.dataIndex]+'/5'; } } }
    }
  }
});

function updateChart(){
  chart.data.datasets = buildDS();
  chart.update();
  document.getElementById('legend').innerHTML = sel.map(function(name){
    var h = hops.find(function(x){ return x.name === name; });
    return '<span><span class="sw" style="background:'+h.color+'"></span>'+h.name+'</span>';
  }).join('');
}

document.getElementById('srch').addEventListener('input', function(e){
  renderBtns(e.target.value);
});
document.getElementById('clrBtn').addEventListener('click', function(){
  sel = [];
  updateChart();
  refreshBtns();
  var box = document.getElementById('hop-desc-box');
  if(box) box.style.display = 'none';
});

renderAlphaTabs();
renderBtns('');
updateChart();
showHopDesc();
</script>

 Lager", "brewery": "Harland", "style": "Lager / Pilsner", "abv": "4.7%", "hops": ["Sorachi Ace"], "url": "https://www.antenna-america.com/en/products/b044-c12027", "image": "https://www.antenna-america.com/cdn/shop/files/HarlandJapaneseLager.jpg?width=400", "description": "日本へのリスペクトを込めてHarland Brewingが醸したジャパニーズ・ラガー。日本産のソラチ・エースホップを使用し、レモン・ディル・コリアンダーのユニークなアロマが漂うクリスプでドライな一本。すっきりとした飲み口と日本料理との相性は抜群。", "source": "antenna", "added": "2026-08-03"}, {"id": "b039-c12012", "name": "Karl Strauss Red Trolley Ale", "brewery": "Karl Strauss", "style": "Amber", "abv": "5.8%", "hops": ["Centennial", "Cascade"], "url": "https://www.antenna-america.com/en/products/b039-c12012", "image": "https://www.antenna-america.com/cdn/shop/files/RedTrolleyAle.jpg?width=400", "description": "サンディエゴの路面電車（トロリー）にちなんだカール・シュトラウスのシグネチャー・アンバーエール。センテニアルとカスケードのバランスよいホップ感と、カラメルモルト由来のリッチな甘みが調和。30年以上愛されるSDクラフトビールの象徴的な一本。", "source": "antenna", "added": "2026-08-03"}, {"id": "b123-c12001", "name": "Paperback Capiche?", "brewery": "Paperback Brewing", "style": "Lager / Pilsner", "abv": "4.5%", "hops": ["Saphir", "Hallertau Blanc"], "url": "https://www.antenna-america.com/en/products/b123-c12001", "image": "https://www.antenna-america.com/cdn/shop/files/PaperbackCapiche.jpg?width=400", "description": "イタリア語で「わかった？」を意味する「Capiche?」。Paperback Brewingのクリスプなラガーにサファイアとハラタウ・ブランのドイツ系ホップを使用。エレガントな柑橘とフローラルのアロマと、スムースでドライなフィニッシュが特徴の4.5%の飲みやすい一本。", "source": "antenna", "added": "2026-08-03"}, {"id": "tc-clevergirl-pkg", "name": "Triple Crossing Clever Girl IPA", "brewery": "Triple Crossing Brewing", "style": "Hazy IPA", "abv": "6.0%", "hops": ["Citra", "Mosaic"], "url": "https://southbound.jp/products/tc-clevergirl-pkg", "image": "https://southbound.jp/cdn/shop/files/TC-clevergirl_can-1440x1800.jpg?width=400", "description": "驚くほどライトボディで、ソフトながらもドライなアメリカンIPA。トロピカルシトラス、ダークベリー、グレープフルーツの果皮、オレンジ風味の松の香りが印象的。厳選されたシトラとモザイクを使用。BeerAdvocateスコア92点、Untappdでも絶賛されるバージニア州リッチモンドの名作。", "source": "southbound", "added": "2026-08-05"}, {"id": "sa-happilyso-pkg", "name": "Sante Adairius Happily So", "brewery": "Sante Adairius", "style": "Hazy IPA", "abv": "6.4%", "hops": ["Citra", "Centennial", "Motueka"], "url": "https://southbound.jp/products/sa-happilyso-pkg", "image": "https://southbound.jp/cdn/shop/files/SA-happilyso_can-1440x1800.jpg?width=400", "description": "Sante Adairiusがサワー・ファームハウス以外のスタイルで醸した珍しいヘイジーIPA。シトラ、センテニアル、モツエカの組み合わせによるジューシーなトロピカルと柑橘のアロマ。ファームハウスで培った発酵技術がIPAにも光る一本。", "source": "southbound", "added": "2026-08-05"}, {"id": "sa-reasonablereasons-pkg", "name": "Resident Culture Reasonable Reasons", "brewery": "Resident Culture", "style": "Hazy IPA", "abv": "6.3%", "hops": ["Strata", "Citra", "Mosaic"], "url": "https://southbound.jp/products/sa-reasonablereasons-pkg", "image": "https://southbound.jp/cdn/shop/files/RC-reasonablereasons_can-1440x1800.jpg?width=400", "description": "「合理的な理由」というタイトルのResident CultureヘイジーIPA。ストラタ、シトラ、モザイクのトリオが生み出すパッションフルーツ、グレープフルーツ、ストロベリーの複雑なアロマ。飲む合理的な理由はこの一杯にある。", "source": "southbound", "added": "2026-08-05"}, {"id": "so-partlycloudy-pkg", "name": "Solace Brewing Partly Cloudy DDH Hazy IPA", "brewery": "Solace Brewing", "style": "Hazy IPA", "abv": "7.5%", "hops": ["El Dorado", "Citra"], "url": "https://southbound.jp/products/so-partlycloudy-pkg", "image": "https://southbound.jp/cdn/shop/files/SO-partlycloudy_can-1440x1800.jpg?width=400", "description": "Solace BrewingのフラッグシップヘイジーIPA。「少し曇り」の名の通り、霞がかったゴールデンカラーにエル・ドラードとシトラのジューシーなトロピカルフルーツのアロマが広がる。ダブルドライホップで香りをさらに引き出した7.5%の力強い一杯。", "source": "southbound", "added": "2026-08-05"}, {"id": "wb-rrmosaicoatcream-pkg", "name": "Westbrook Rinse/Repeat (Mosaic Oat Cream)", "brewery": "Westbrook Brewing", "style": "Hazy IPA", "abv": "6.5%", "hops": ["Mosaic"], "url": "https://southbound.jp/products/wb-rrmosaicoatcream-pkg", "image": "https://southbound.jp/cdn/shop/files/WB-rrmosaicoatcream_can-1440x1800.jpg?width=400", "description": "毎回ホップを変えるWestbrookのリンス/リピートシリーズ。今回はモザイクをダブルドライホップした「オーツ麦クリーム」バッチ。たっぷりのオーツ麦と少量の乳糖が加わり、クリーミーで柑橘感あふれるまろやかな口当たり。", "source": "southbound", "added": "2026-08-05"}, {"id": "na-thediceareloaded-pkg", "name": "Narrow Gauge The Dice Are Loaded Hazy DIPA", "brewery": "Narrow Gauge Brewing", "style": "Hazy DIPA", "abv": "8.2%", "hops": ["Mosaic"], "url": "https://southbound.jp/products/na-thediceareloaded-pkg", "image": "https://southbound.jp/cdn/shop/files/NA-thediceareloaded_can-1440x1800.jpg?width=400", "description": "「サイコロは仕込まれている」ミズーリ州セントルイスのNarrow Gauge BrewingによるヘイジーダブルIPA。モザイクペレット・クライオ・インコグニートの3形態のモザイクホップを使用した、モザイク尽くしの集大成ビール。ブルーベリー、タンジェリン、トロピカルが多層的に押し寄せる。", "source": "southbound", "added": "2026-08-05"}, {"id": "wh-spellbinder-2026-pkg", "name": "Wren House Spellbinder Hazy IPA", "brewery": "Wren House Brewing", "style": "Hazy IPA", "abv": "6.9%", "hops": ["Citra", "Galaxy", "Mosaic"], "url": "https://southbound.jp/products/wh-spellbinder-pkg", "image": "https://southbound.jp/cdn/shop/files/WH-spellbinder_can-1440x1800.jpg?width=400", "description": "2020年GABF金賞、2023年ヨーロピアンビアスター金賞を受賞し、世界最高のヘイジーIPAの一つとして君臨。北米産ピルスナーモルト、クリーミーなオーツ麦、小麦をベースに米国・豪州産ホップを使用。シトラス、タンジェリン、ピーチのフレーバーとジューシーなフィニッシュが魅力のベンチマーク的ヘイジーIPA。", "source": "southbound", "added": "2026-08-05"}, {"id": "b060-b12001", "name": "Smog City IPA", "brewery": "Smog City", "style": "West Coast IPA", "abv": "-", "hops": ["Centennial", "Cascade", "Chinook"], "url": "https://www.antenna-america.com/en/products/b060-b12001", "image": "https://www.antenna-america.com/cdn/shop/files/SmogCityIPA.jpg?width=400", "description": "Smog Cityのシグネチャー・ウェストコーストIPA。LAのスモッグを名に冠したブリュワリーが誇るクリーンでドライ、力強いホップキャラクターの定番IPA。", "source": "antenna", "added": "2026-08-10"}, {"id": "stone-delicious", "name": "Stone Delicious IPA", "brewery": "Stone Brewing", "style": "IPA", "abv": "7.7%", "hops": ["Lemondrop", "El Dorado"], "url": "https://www.antenna-america.com/en/products/b010-c12059", "image": "https://www.antenna-america.com/cdn/shop/files/StoneDeliciousIPA.jpg?width=400", "description": "レモンドロップとエル・ドラードホップが生み出すスパイシーなレモンピール・柑橘のアロマが印象的な低グルテンIPA。White Labs製の特殊酵素でグルテンを除去しながら通常のIPAと同じ力強いホップフレーバーを実現。", "source": "antenna", "added": "2026-08-10"}, {"id": "elsegundo-mayberry", "name": "El Segundo Mayberry IPA", "brewery": "El Segundo", "style": "West Coast IPA", "abv": "-", "hops": ["Mosaic"], "url": "https://www.antenna-america.com/en/products/b083-c16002", "image": "https://www.antenna-america.com/cdn/shop/files/MayberryIPA.jpg?width=400", "description": "エル・セグンドを代表するクラシックなウェストコーストIPA。モザイクホップが中心のグラッシーでベリーのアロマが特徴。「海辺のメイベリー」と呼ばれるエル・セグンドでゆっくり楽しむために生まれたビール。", "source": "antenna", "added": "2026-08-10"}, {"id": "stone-ipa-568", "name": "Stone IPA (568ml)", "brewery": "Stone Brewing", "style": "IPA", "abv": "6.9%", "hops": ["Chinook", "Columbus", "Centennial"], "url": "https://www.antenna-america.com/en/products/b010-c12001a", "image": "https://www.antenna-america.com/cdn/shop/files/StoneIPA568.jpg?width=400", "description": "1997年からのロングセラー、ストーンIPAの568ml缶。チヌーク、コロンバス、センテニアルによるグレープフルーツ・パイン・樹脂の力強いアロマ。カスケードを使わないユニークなWC IPA。", "source": "antenna", "added": "2026-08-10"}, {"id": "elsegundo-brokenskull", "name": "El Segundo Broken Skull IPA", "brewery": "El Segundo", "style": "IPA", "abv": "-", "hops": ["Citra", "Cascade", "Chinook"], "url": "https://www.antenna-america.com/en/products/b083-c16001", "image": "https://www.antenna-america.com/cdn/shop/files/BrokenSkullIPA.jpg?width=400", "description": "元プロレスラーのスティーブ・オースティンとのコラボIPA。シトラ、カスケード、チヌークが生み出すフルーティで柑橘系のフレーバーと絶妙なバランス。引退後にブリュワリーを作る夢を持っていたオースティンとEl Segundoの縁が生んだコラボ作。", "source": "antenna", "added": "2026-08-10"}, {"id": "tg-ddhkingsue", "name": "Toppling Goliath DDH King Sue", "brewery": "Toppling Goliath", "style": "DIPA", "abv": "-", "hops": ["Citra"], "url": "https://www.antenna-america.com/en/products/b056-c16006", "image": "https://www.antenna-america.com/cdn/shop/files/DDHKingSue.jpg?width=400", "description": "キング・スーをダブルドライホップした究極版。シトラのグレープフルーツ・ライム・トロピカルのアロマがさらに倍増。DDHがいかにホップアロマを引き出すかを体感できる一本。", "source": "antenna", "added": "2026-08-10"}, {"id": "topa-dosto DryHardCider.png?width=400", "description": "コロナドのナイス＆ドライ・ハードサイダー。その名の通りすっきりとドライな飲み口が特徴のサイダー。甘すぎず爽やかなフィニッシュで、食事にも合わせやすい万能な一本。", "source": "antenna", "added": "2026-08-13"}, {"id": "b055-c16151", "name": "Revision Single Track Theory WC IPA", "brewery": "Revision Brewing", "style": "West Coast IPA", "abv": "-", "hops": ["Citra", "Mosaic", "Simcoe"], "url": "https://www.antenna-america.com/en/products/b055-c16151", "image": "https://www.antenna-america.com/cdn/shop/files/SingleTrackTheory.png?width=400", "description": "シングルトラック（山道）をひたすら走るような一途な集中力で醸されたRevisionのウェストコーストIPA。シトラ、モザイク、シムコーが生み出すパイン・グレープフルーツ・柑橘のクリーンなアロマ。ドライでキレのあるフィニッシュが心地よい。", "source": "antenna", "added": "2026-08-13"}, {"id": "b055-c16150", "name": "Revision Ridgeline Glow Hazy IPA", "brewery": "Revision Brewing", "style": "Hazy IPA", "abv": "-", "hops": ["Citra", "Galaxy", "El Dorado"], "url": "https://www.antenna-america.com/en/products/b055-c16150", "image": "https://www.antenna-america.com/cdn/shop/files/RidgelineGlow.png?width=400", "description": "山の尾根に輝くアルペングロー（山岳残照）をテーマにしたRevisionのヘイジーIPA。シトラ、ギャラクシー、エル・ドラードが生み出すトロピカルフルーツと柑橘の輝くようなアロマ。夕暮れの山頂で飲みたくなる美しい一杯。", "source": "antenna", "added": "2026-08-13"}, {"id": "b015-c16007", "name": "Coronado Crocodile Rock IPA", "brewery": "Coronado", "style": "IPA", "abv": "-", "hops": [], "url": "https://www.antenna-america.com/en/products/b015-c16007", "image": "https://www.antenna-america.com/cdn/shop/files/CrocodileRockIPA.png?width=400", "description": "コロナドのクロコダイル・ロックIPA。岩場のワニのような力強くも洗練されたウェストコーストIPAスタイル。サンディエゴの海岸沿いにあるコロナドが醸す、クリーンでドライなホップキャラクターが特徴。", "source": "antenna", "added": "2026-08-13"}, {"id": "b015-c16006", "name": "Coronado Big Weekend DIPA", "brewery": "Coronado", "style": "DIPA", "abv": "-", "hops": [], "url": "https://www.antenna-america.com/en/products/b015-c16006", "image": "https://www.antenna-america.com/cdn/shop/files/BigWeekendDIPA.png?width=400", "description": "「大きな週末」の名を冠したコロナドのダブルIPA。週末の解放感をそのままビールに閉じ込めたような、豊かなホップアロマとしっかりとしたモルトボディが印象的な一本。", "source": "antenna", "added": "2026-08-13"}, {"id": "b015-c16005", "name": "Coronado Aloha Warrior IPA", "brewery": "Coronado", "style": "IPA", "abv": "-", "hops": ["Simcoe", "Chinook", "Columbus Cryo"], "url": "https://www.antenna-america.com/en/products/b015-c16005", "image": "https://www.antenna-america.com/cdn/shop/files/AlohaWarriorIPA.png?width=400", "description": "「アロハ・ウォリアー」の名を冠したコロナドのIPA。ハワイの精神（アロハ）と戦士の力強さを兼ね備えた、フルーティでホッピーな一杯。", "source": "antenna", "added": "2026-08-13"}, {"id": "b015-c16004", "name": "Coronado Nado Premium Lager", "brewery": "Coronado", "style": "Lager / Pilsner", "abv": "-", "hops": ["Hallertauer Mittelfruher"], "url": "https://www.antenna-america.com/en/products/b015-c16004", "image": "https://www.antenna-america.com/cdn/shop/files/NadoPremiumLager.png?width=400", "description": "「ナド（竜巻）」の名を冠したコロナドのプレミアム・ラガー。竜巻のように一気に飲み干したくなるクリスプでクリーンなラガー。コロナドらしいカリフォルニア・スタイルの爽快感。", "source": "antenna", "added": "2026-08-13"}, {"id": "b015-c16003", "name": "Coronado Orange Avenue Wit", "brewery": "Coronado", "style": "Wheat Ale", "abv": "-", "hops": [], "url": "https://www.antenna-america.com/en/products/b015-c16003", "image": "https://www.antenna-america.com/cdn/shop/files/OrangeAvenue.png?width=400", "description": "コロナドを代表するウィットビール。オレンジアベニューはコロナド島のメインストリートで、その名の通りオレンジ、コリアンダー、ライトスパイスの爽やかなアロマが漂う。夏のビーチに最適なセッショナブルな一本。", "source": "antenna", "added": "2026-08-13"}, {"id": "b015-c16002", "name": "Coronado Hazy Weekend Hazy IPA", "brewery": "Coronado", "style": "Hazy IPA", "abv": "-", "hops": [], "url": "https://www.antenna-america.com/en/products/b015-c16002", "image": "https://www.antenna-america.com/cdn/shop/files/HazyWeekendHazyIPA.png?width=400", "description": "「ヘイジーな週末」をテーマにしたコロナドのヘイジーIPA。霞がかった週末の朝のようなソフトでジューシーなトロピカルフルーツのアロマ。のんびりリラックスしながら飲みたい一本。", "source": "antenna", "added": "2026-08-13"}, {"id": "b015-c12001", "name": "Coronado Weekend Vibes IPA", "brewery": "Coronado", "style": "IPA", "abv": "-", "hops": [], "url": "https://www.antenna-america.com/en/products/b015-c12001", "image": "https://www.antenna-america.com/cdn/shop/files/WeekendVibesIPA_4.png?width=400", "description": "コロナドのウィークエンド・ヴァイブスIPA。週末のバイブスをそのままビールに表現した、軽やかでフルーティなセッションIPA。コロナド島でくつろぐ週末の気分を味わえる定番作。", "source": "antenna", "added": "2026-08-13"}, {"id": "b041-c12125", "name": "Sierra Nevada Rye Torpedo IPA", "brewery": "Sierra Nevada", "style": "IPA", "abv": "-", "hops": ["Torpedo Hop", "Centennial", "Chinook"], "url": "https://www.antenna-america.com/en/products/b041-c12125", "image": "https://www.antenna-america.com/cdn/shop/files/RyeTorpedoIPA.png?width=400", "description": "シエラネバダのトルピードIPAのライ麦バリアント。独自のトルピード・ドライホップ装置で生み出す強烈なホップアロマに、ライ麦が加えるスパイシーでアーシーなニュアンスが融合。クラシックなウェストコーストIPAをライ麦でひねりを加えた意欲作。", "source": "antenna", "added": "2026-08-13"}, {"id": "b041-c12115", "name": "Sierra Nevada Peachy Little Thing", "brewery": "Sierra Nevada", "style": "Hazy IPA", "abv": "-", "hops": ["Citra", "Mosaic"], "url": "https://www.antenna-america.com/en/products/b041-c12115", "image": "https://www.antenna-america.com/cdn/shop/files/PeachyLittleThing_2.png?width=400", "description": "ヘイジー・リトル・シングの桃バージョン。カリフォルニア産の桃をたっぷり加え、シトラとモザイクのトロピカルアロマに桃の甘い香りが重なる夏限定のヘイジーIPA。缶を開けた瞬間から桃畑にいるような幸福感が広がる。", "source": "antenna", "added": "2026-08-13"}, {"id": "b041-c12112", "name": "Sierra Nevada Rad Little Thing", "brewery": "Sierra Nevada", "style": "Hazy IPA", "abv": "-", "hops": ["Citra", "Mosaic", "Galaxy"], "url": "https://www.antenna-america.com/en/products/b041-c12112", "image": "https://www.antenna-america.com/cdn/shop/files/RadLittleThing.png?width=400", "description": "「ラッド（最高にクールな）リトル・シング」。ヘイジー・リトル・シングシリーズのX版で、シトラ、モザイク、ギャラクシーの3種のホップを組み合わせ、よりエキサイティングなトロピカルアロマを実現した一本。", "source": "antenna", "added": "2026-08-13"}, {"id": "b041-c12109", "name": "Sierra Nevada Cosmic Little Thing", "brewery": "Sierra Nevada", "style": "Hazy DIPA", "abv": "-", "hops": ["Citra", "Mosaic", "Simcoe", "Galaxy"], "url": "https://www.antenna-america.com/en/products/b041-c12109", "image": "https://www.antenna-america.com/cdn/shop/files/CosmicLittleThing.png?width=400", "description": "「コズミック（宇宙的な）リトル・シング」。ヘイジー・リトル・シングシリーズのダブルIPA版。シトラ、モザイク、シムコー、ギャラクシーの4種を使い、宇宙規模のトロピカルフルーツ・柑橘のアロマが銀河を飛び回る一本。", "source": "antenna", "added": "2026-08-13"}, {"id": "b041-c12100", "name": "Sierra Nevada Atomic Torpedo", "brewery": "Sierra Nevada", "style": "DIPA", "abv": "-", "hops": ["Simcoe", "Citra", "Centennial"], "url": "https://www.antenna-america.com/en/products/b041-c12100", "image": "https://www.antenna-america.com/cdn/shop/files/AtomicTorpedo202312oz.png?width=400", "description": "トルピードIPAのダブル版「アトミック・トルピード」。シムコー、シトラ、センテニアルを独自のトルピード・ドライホップ装置で処理し、原子爆発のような強烈なホップアロマを実現。シエラネバダの醸造技術の粋を凝縮した力作DIPA。", "source": "antenna", "added": "2026-08-13"}, {"id": "b055-c16037", "name": "Revision Disco Ninja", "brewery": "Revision Brewing", "style": "Hazy IPA", "abv": "-", "hops": ["Citra", "Mosaic", "Galaxy"], "url": "https://www.antenna-america.com/en/products/b055-c16037", "image": "https://www.antenna-america.com/cdn/shop/products/DiscoNinja_1.png?width=400", "description": "ディスコとニンジャという異色の組み合わせ。1970年代のディスコの輝きと忍者の静寂が融合したRevisionのヘイジーIPA。シトラ、モザイク、ギャラクシーのトロピカル・柑橘のアロマがフロアを席巻。", "source": "antenna", "added": "2026-08-13"}, {"id": "b055-c12013", "name": "Revision DIPA", "brewery": "Revision Brewing", "style": "DIPA", "abv": "-", "hops": ["Citra", "Simcoe", "Mosaic"], "url": "https://www.antenna-america.com/en/products/b055-c12013", "image": "https://www.antenna-america.com/cdn/shop/files/DIPA_2.png?width=400", "description": "Revisionの看板DIPA。シトラ、シムコー、モザイクの力強いトリオが生み出す、ジューシーで果実感溢れるダブルIPA。リノのクラフトビールシーンを牽引するRevisionの真骨頂。", "source": "antenna", "added": "2026-08-13"}, {"id": "b055-c12006", "name": "Revision IPA", "brewery": "Revision Brewing", "style": "IPA", "abv": "-", "hops": ["Cascade", "Centennial", "Chinook", "Citra"], "url": "https://www.antenna-america.com/en/products/b055-c12006", "image": "https://www.antenna-america.com/cdn/shop/products/5e688c79-6584-406b-b3f6-35d7fd5ad003_72ae79ea-4597-4f30-bed6-ad412a78b2dc.jpg?width=400", "description": "RevisionのシグネチャーウェストコーストIPA。カスケード、センテニアル、チヌーク、シトラのクラシックなアメリカン4種ホップを使い、グレープフルーツ・パイン・フローラルの力強いアロマとバランスの取れた苦みが魅力。", "source": "antenna", "added": "2026-08-13"}];</script>
<script>// ===== PRODUCTS TAB =====

function isRecent(d){ return d && (new Date()-new Date(d))/864e5 <= 7; }
function sgroup(s){
  if(/dipa|double|imperial|triple|quad/i.test(s)) return 'DIPA';
  if(/hazy|ne-style|northeast/i.test(s)) return 'IPA';
  if(/ipa|india/i.test(s)) return 'IPA';
  if(/pale ale|belgian pale/i.test(s)) return 'Pale Ale';
  if(/saison|farmhouse/i.test(s)) return 'Sour';
  if(/sour|lambic|gose|berliner/i.test(s)) return 'Sour';
  if(/lager|pilsner/i.test(s)) return 'Lager';
  if(/stout|porter/i.test(s)) return 'Stout';
  return 'Other';
}

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ブルワリーフィルタを動的生成
function buildBreweryFilter(){
  var sel = document.getElementById('bfil');
  if(!sel) return;
  var breweries = [...new Set(products.map(function(p){ return p.brewery; }))].sort();
  breweries.forEach(function(b){
    var o = document.createElement('option');
    o.value = b;
    o.textContent = b;
    sel.appendChild(o);
  });
}

var cameFromProduct = false;

function renderProds(){
  var s = document.getElementById('psrch').value.toLowerCase();
  var sf = document.getElementById('sfil').value;
  var shopf = document.getElementById('shopfil').value;
  var bf = document.getElementById('bfil').value;
  var list = document.getElementById('prod-list');
  list.innerHTML = '';
  var f = products.filter(function(p){
    var ms = p.name.toLowerCase().indexOf(s) >= 0 || p.brewery.toLowerCase().indexOf(s) >= 0;
    var mst = !sf || sgroup(p.style) === sf;
    var mshop = !shopf ||
      (shopf === 'southbound' && p.source === 'southbound') ||
      (shopf === 'antenna' && p.source !== 'southbound');
    var mbrew = !bf || p.brewery === bf;
    return ms && mst && mshop && mbrew;
  });
  document.getElementById('prod-count').textContent = f.length + '件表示（全' + products.length + '件）';

  f.forEach(function(p){
    var row = document.createElement('div');
    row.className = 'prod-row';
    row.addEventListener('click', function(){ openModal(p); });

    var newB = isRecent(p.added) ? '<span class="new-badge">NEW</span>' : '';
    var shopB = p.source === 'southbound'
      ? '<span class="shop-badge">Southbound</span>'
      : '';
    var hopStr = p.hops && p.hops.length > 0 ? p.hops.join(' / ') : '';

    var imgHtml = '';
    if(p.image){
      imgHtml = '<img class="prod-row-img" src="' + escHtml(p.image) + '" alt="' + escHtml(p.name) + '" loading="lazy" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'">'
              + '<div class="prod-row-img-placeholder" style="display:none">🍺</div>';
    } else {
      imgHtml = '<div class="prod-row-img-placeholder">🍺</div>';
    }

    row.innerHTML =
      imgHtml
      + '<div class="prod-row-left">'
        + '<div class="prod-row-name">' + escHtml(p.name) + (newB ? '&nbsp;' + newB : '') + shopB + '</div>'
        + '<div class="prod-row-brewery">' + escHtml(p.brewery) + '</div>'
        + '<div class="prod-row-sub">'
          + '<span class="sbadge">' + escHtml(p.style) + '</span>'
          + ((p.abv && p.abv !== '-') ? '<span class="abv-text">' + escHtml(p.abv) + '</span>' : '')
        + '</div>'
      + '</div>'
      + '<div class="prod-row-right">'
        + (hopStr ? '<div class="prod-hop-list">' + escHtml(hopStr) + '</div>' : '<div class="prod-hop-none">−</div>')
        + '<div class="prod-row-arrow">\u203a</div>'
      + '</div>';

    list.appendChild(row);
  });
}

function openModal(p){
  var mImgWrap = document.getElementById('m-img-wrap');
  if(p.image){
    mImgWrap.innerHTML = '<img class="m-img" src="' + escHtml(p.image) + '" alt="' + escHtml(p.name) + '" onerror="this.parentNode.innerHTML=\'\'">';
    mImgWrap.style.display = '';
  } else {
    mImgWrap.innerHTML = '';
    mImgWrap.style.display = 'none';
  }

  document.getElementById('m-title').textContent = p.name;
  document.getElementById('m-brewery').textContent = p.brewery;
  document.getElementById('m-style').textContent = p.style || '\u2212';
  document.getElementById('m-abv').textContent = (p.abv && p.abv !== '-') ? p.abv : '不明';

  var mdesc = document.getElementById('m-desc-sec');
  if(p.description){
    document.getElementById('m-desc').textContent = p.description;
    mdesc.style.display = '';
  } else {
    mdesc.style.display = 'none';
  }

  var mh = document.getElementById('m-hops');
  mh.innerHTML = '';
  if(p.hops && p.hops.length > 0){
    var tags = document.createElement('div');
    tags.className = 'm-hops';
    p.hops.forEach(function(h){
      var sp = document.createElement('span');
      sp.className = 'm-hop';
      sp.textContent = h;
      sp.addEventListener('click', function(){ hopFilter(h); });
      tags.appendChild(sp);
    });
    mh.appendChild(tags);
  } else {
    mh.innerHTML = '<div class="m-nohop">ホップ情報は非公開です</div>';
  }

  var acts = document.getElementById('m-actions');
  acts.innerHTML = '';

  var ch = (p.hops||[]).filter(function(h){ return hops.find(function(x){ return x.name === h; }); });
  if(ch.length > 0){
    var cb = document.createElement('button');
    cb.className = 'm-btn-chart';
    cb.textContent = '📊 アロマチャートで比較';
    cb.addEventListener('click', function(){
      document.getElementById('modal').classList.remove('open');
      cameFromProduct = true;
      sel = ch;
      updateChart();
      renderBtns('');
      showHopDesc();
      var radarBtn = document.querySelector('.tab-nav button');
      switchTab('t1', radarBtn);
      showBackToProducts();
    });
    acts.appendChild(cb);
  }

  if(p.url && p.url.indexOf('/collections/') === -1){
    var lb = document.createElement('a');
    lb.className = 'm-btn-link';
    lb.href = p.url;
    lb.target = '_blank';
    lb.rel = 'noopener noreferrer';
    lb.textContent = p.source === 'southbound'
      ? '🛒 Southboundの商品ページへ'
      : '🛒 Antenna Americaの商品ページへ';
    acts.appendChild(lb);
  }

  document.getElementById('modal').classList.add('open');
}

function showBackToProducts(){
  var existing = document.getElementById('back-to-products-btn');
  if(existing) return;
  var btn = document.createElement('button');
  btn.id = 'back-to-products-btn';
  btn.className = 'back-to-products-btn';
  btn.innerHTML = '\u2190 商品一覧に戻る';
  btn.addEventListener('click', function(){
    cameFromProduct = false;
    btn.remove();
    var prodBtn = document.querySelectorAll('.tab-nav button')[1];
    switchTab('t2', prodBtn);
  });
  var t1 = document.getElementById('t1');
  var chartWrap = t1.querySelector('.chart-wrap');
  t1.insertBefore(btn, chartWrap);
}

function hopFilter(h){
  document.getElementById('modal').classList.remove('open');
  document.getElementById('psrch').value = h;
  document.getElementById('sfil').value = '';
  document.getElementById('shopfil').value = '';
  document.getElementById('bfil').value = '';
  renderProds();
}

function closeModal(e){
  if(e.target === document.getElementById('modal')){
    document.getElementById('modal').classList.remove('open');
  }
}

document.getElementById('psrch').addEventListener('input', renderProds);
document.getElementById('sfil').addEventListener('change', renderProds);
document.getElementById('shopfil').addEventListener('change', renderProds);
document.getElementById('bfil').addEventListener('change', renderProds);

buildBreweryFilter();
renderProds();
</script>
</body>
</html>
