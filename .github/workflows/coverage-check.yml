name: Coverage Check (every 2 weeks + manual, read-only)

# 「総チェック」(scripts/coverage_check.py)をGitHub上で実行する。何も書き換えない・コミットしない。
#  - 定期実行: 毎週水曜10:00 JST(=週次の巡回の翌日)に起動し、偶数週だけ実行する(=2週間に1回。ユーザー提案、2026-11-26)。
#    人が見るべきもの(登録漏れ・更新漏れ・二重登録の疑い・チャートに無いホップ・公開ページの不一致・読めない収集元)が
#    1つでもあれば失敗扱いになり、GitHubの通知メールで気づける。何も無ければ静かに成功する。
#  - 手動実行: Actions -> Coverage Check -> Run workflow、または gh workflow run coverage-check.yml(奇数週でも実行する)。
#    結果は gh run view <id> --log の「Run coverage check」を読む。
# 手元のPCから全カタログを繰り返し取ると、AntennaとSouthbound等のCloudflare/Shopifyにボット確認・レート制限で止められる
# (2026-11-25に発生。突破はしない)ので、総チェックはここで実行する。
on:
  schedule:
    - cron: '0 1 * * 3'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Decide whether to run (every other week)
        id: gate
        run: |
          week=$((10#$(date -u +%V)))
          if [ "${{ github.event_name }}" = "schedule" ] && [ $((week % 2)) -ne 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "ISO week $week is odd: skipped (this check runs every 2 weeks)"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Run coverage check
        if: steps.gate.outputs.run == 'true'
        env:
          PYTHONUTF8: '1'
        run: python scripts/coverage_check.py --strict
