name: Weekly Antenna America Hop Product Update

on:
  schedule:
    # Every Tuesday at 09:00 JST (00:00 UTC)
    - cron: '0 0 * * 2'
  workflow_dispatch: {}   # allows manual "Run workflow" trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-products:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run update script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_products.py

      - name: Rebuild public HTML page
        run: python scripts/build_html.py

      - name: Commit and push if changed
        run: |
          git config user.name "hop-bot"
          git config user.email "hop-bot@users.noreply.github.com"
          git add data/products.json data/last_run_summary.json docs/index.html
          git diff --cached --quiet || git commit -m "Weekly update: $(date +'%Y-%m-%d')"
          git push

      - name: Show summary
        run: cat data/last_run_summary.json
